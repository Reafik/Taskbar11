<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Design Context Pro</title>
  <style>
    * {
      box-sizing: border-box;
    }
    
    body {
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      font-size: 12px;
      background: var(--figma-color-bg);
      color: var(--figma-color-text);
    }
    
    #root {
      width: 100%;
      height: 100vh;
      overflow: auto;
    }
    
    .container {
      padding: 16px;
    }
    
    h1, h2, h3, h4 {
      margin: 0 0 12px 0;
      font-weight: 600;
    }
    
    h1 {
      font-size: 16px;
    }
    
    h2 {
      font-size: 14px;
    }
    
    h3 {
      font-size: 13px;
    }
    
    label {
      display: block;
      margin-bottom: 4px;
      font-weight: 500;
      font-size: 11px;
      color: var(--figma-color-text-secondary);
    }
    
    input[type="text"],
    textarea {
      width: 100%;
      padding: 8px;
      border: 1px solid var(--figma-color-border);
      border-radius: 4px;
      background: var(--figma-color-bg);
      color: var(--figma-color-text);
      font-family: inherit;
      font-size: 12px;
      margin-bottom: 12px;
    }
    
    textarea {
      min-height: 80px;
      resize: vertical;
    }
    
    button {
      padding: 8px 16px;
      border: none;
      border-radius: 4px;
      background: var(--figma-color-bg-brand);
      color: white;
      font-family: inherit;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    
    button:hover {
      opacity: 0.9;
    }
    
    button:active {
      opacity: 0.8;
    }
    
    button.secondary {
      background: var(--figma-color-bg-secondary);
      color: var(--figma-color-text);
    }
    
    button.danger {
      background: #f24822;
    }
    
    .button-group {
      display: flex;
      gap: 8px;
      margin-top: 16px;
    }
    
    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--figma-color-text-secondary);
    }
    
    .empty-state-icon {
      font-size: 48px;
      margin-bottom: 16px;
      opacity: 0.3;
    }
    
    .tag-input {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 12px;
    }
    
    .tag {
      padding: 4px 8px;
      background: var(--figma-color-bg-secondary);
      border-radius: 3px;
      font-size: 11px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    
    .tag-remove {
      cursor: pointer;
      opacity: 0.6;
    }
    
    .tag-remove:hover {
      opacity: 1;
    }
    
    .property-list {
      margin-bottom: 12px;
    }
    
    .property-item {
      padding: 8px;
      background: var(--figma-color-bg-secondary);
      border-radius: 4px;
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }
    
    .property-item-content {
      flex: 1;
    }
    
    .property-item-remove {
      cursor: pointer;
      opacity: 0.6;
      padding: 4px;
    }
    
    .property-item-remove:hover {
      opacity: 1;
    }
    
    .alert {
      padding: 8px 12px;
      border-radius: 4px;
      margin-bottom: 12px;
      font-size: 11px;
    }
    
    .alert-success {
      background: rgba(0, 200, 100, 0.1);
      color: #00c864;
      border: 1px solid rgba(0, 200, 100, 0.2);
    }
    
    .alert-error {
      background: rgba(242, 72, 34, 0.1);
      color: #f24822;
      border: 1px solid rgba(242, 72, 34, 0.2);
    }
    
    .selection-info {
      padding: 12px;
      background: var(--figma-color-bg-secondary);
      border-radius: 6px;
      margin-bottom: 16px;
    }
    
    .selection-info-title {
      font-weight: 600;
      margin-bottom: 4px;
    }
    
    .selection-info-type {
      font-size: 11px;
      color: var(--figma-color-text-secondary);
    }
    
    .tabs {
      display: flex;
      gap: 4px;
      margin-bottom: 16px;
      border-bottom: 1px solid var(--figma-color-border);
    }
    
    .tab {
      padding: 8px 12px;
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      color: var(--figma-color-text-secondary);
      cursor: pointer;
    }
    
    .tab:hover {
      opacity: 1;
      color: var(--figma-color-text);
    }
    
    .tab.active {
      color: var(--figma-color-text);
      border-bottom-color: var(--figma-color-bg-brand);
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="ui.js"></script>
</body>
</html>
